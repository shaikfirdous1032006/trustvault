services:
  - type: web
    name: trustvault
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_APP_URL
        generateValue: false
      - key: DEMO_PASSWORD
        value: TrustVault2024!
      - key: NEXT_PUBLIC_SUPABASE_URL
        generateValue: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        generateValue: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        generateValue: false
      - key: SESSION_SECRET
        generateValue: true

